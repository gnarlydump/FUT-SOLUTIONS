name: Check fut.gg for new evolutions and SBCs

on:
  schedule:
    # Runs at the top of every hour, all day, as a general safety net
    # (GitHub may delay this by a few minutes during busy periods -- that's
    # normal for scheduled Actions). The precise 10:00/10:05 AM MST daily
    # checks are handled externally by cron-job.org calling the
    # workflow_dispatch API below, NOT by additional cron lines here --
    # GitHub's own scheduled triggers proved unreliable for that (delayed
    # by up to an hour, and newly-added cron lines sometimes never fired at
    # all). Keeping only the hourly entry here also avoids this schedule
    # colliding with the external 17:00/17:05 UTC triggers and launching
    # two overlapping runs at once (see `concurrency` below for the actual
    # duplicate-post protection either way).
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_expiry_repost:
        description: "Force a fresh repost of all currently-expiring evolutions (ignores what's already been notified)"
        type: boolean
        default: false

# If a run is somehow still in progress when the next trigger fires
# (e.g. the hourly schedule and an external cron-job.org trigger landing
# close together), queue the new run instead of starting it in parallel.
# Two runs executing at once would both read the same "seen" state before
# either had a chance to save it, and both would post the same "new" items
# -- this is what caused duplicate Discord posts. Queuing (not canceling)
# means the second run always starts from the first run's already-updated
# state, so it correctly sees those items as no longer new.
concurrency:
  group: futgg-bot-check
  cancel-in-progress: false

permissions:
  contents: write  # needed so the workflow can commit the updated state file

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run bot
        env:
          EVOLUTIONS_WEBHOOK_URL: ${{ secrets.EVOLUTIONS_WEBHOOK_URL }}
          SBC_WEBHOOK_URL: ${{ secrets.SBC_WEBHOOK_URL }}
          OBJECTIVES_WEBHOOK_URL: ${{ secrets.OBJECTIVES_WEBHOOK_URL }}
          EXPIRING_EVOLUTIONS_WEBHOOK_URL: ${{ secrets.EXPIRING_EVOLUTIONS_WEBHOOK_URL }}
          EVOLUTIONS_ROLE_ID: ${{ secrets.EVOLUTIONS_ROLE_ID }}
          SBC_ROLE_ID: ${{ secrets.SBC_ROLE_ID }}
          OBJECTIVES_ROLE_ID: ${{ secrets.OBJECTIVES_ROLE_ID }}
          EXPIRING_ROLE_ID: ${{ secrets.EXPIRING_ROLE_ID }}
          FORCE_EXPIRY_REPOST: ${{ inputs.force_expiry_repost }}
        run: python bot.py

      - name: Commit updated state
        run: |
          git config user.name "futgg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "Update seen evolutions/SBCs state"
          git push
