name: Check fut.gg for new evolutions and SBCs

on:
  schedule:
    # Runs at the top of every hour (GitHub may delay this by a few minutes
    # during busy periods -- that's normal for scheduled Actions). This also
    # happens to line up exactly with fut.gg's daily content drop, since it
    # fires at 17:00 UTC = 10:00 AM Arizona/MST (no DST there).
    - cron: "0 * * * *"
    # Follow-up checks after the daily drop (10:01 / 10:05 / 10:10 / 10:15
    # AM MST). None of these fire before 10:00 -- they exist because
    # GitHub's scheduled triggers aren't precise and can run late, so this
    # gives several chances to catch the new content shortly after it
    # actually goes live instead of waiting up to an hour for the next
    # hourly check.
    - cron: "1 17 * * *"   # 10:01 AM MST
    - cron: "5 17 * * *"   # 10:05 AM MST
    - cron: "10 17 * * *"  # 10:10 AM MST
    - cron: "15 17 * * *"  # 10:15 AM MST
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated state file

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run bot
        env:
          EVOLUTIONS_WEBHOOK_URL: ${{ secrets.EVOLUTIONS_WEBHOOK_URL }}
          SBC_WEBHOOK_URL: ${{ secrets.SBC_WEBHOOK_URL }}
          OBJECTIVES_WEBHOOK_URL: ${{ secrets.OBJECTIVES_WEBHOOK_URL }}
          EVOLUTIONS_ROLE_ID: ${{ secrets.EVOLUTIONS_ROLE_ID }}
          SBC_ROLE_ID: ${{ secrets.SBC_ROLE_ID }}
          OBJECTIVES_ROLE_ID: ${{ secrets.OBJECTIVES_ROLE_ID }}
        run: python bot.py

      - name: Commit updated state
        run: |
          git config user.name "futgg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "Update seen evolutions/SBCs state"
          git push
